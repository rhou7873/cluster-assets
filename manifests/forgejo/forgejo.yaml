apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
# All Forgejo state (repos, config, and the SQLite DB) lives here on Longhorn
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate          # one pod against one data volume
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0   # LTS alternative: 11.0
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: TZ
              value: "America/Denver"               # <-- EDIT if needed
            # Pre-fills the first-run wizard so links/redirects work behind the ingress
            - name: FORGEJO__server__DOMAIN
              value: "forgejo.internal"
            - name: FORGEJO__server__ROOT_URL
              value: "http://forgejo.internal/"
            - name: FORGEJO__server__SSH_DOMAIN
              value: "forgejo.internal"
            - name: FORGEJO__database__DB_TYPE
              value: "sqlite3"                        # built-in DB, no Postgres needed
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    app: forgejo
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: traefik
  rules:
    - host: forgejo.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 80
